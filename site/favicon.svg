<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- The DevGame mark: the `>` of a shell prompt and the play triangle of a
       game, in one glyph. Stroke is heavy so it survives a 16px favicon. -->
  <defs>
    <linearGradient id="m" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9BD3FF" />
      <stop offset="100%" stop-color="#4FA6EE" />
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="228" fill="#0F141A" />
  <path d="M 372 286 L 654 512 L 372 738" fill="none" stroke="url(#m)"
        stroke-width="128" stroke-linecap="round" stroke-linejoin="round" />
</svg>
